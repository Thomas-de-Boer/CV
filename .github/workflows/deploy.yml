name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Once a day, so the project cards follow what is pinned on GitHub.
  # 04:00 UTC = 05:00 or 06:00 in the Netherlands.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Test
        working-directory: ai
        run: cargo test --release

      # Weights are committed; nothing is generated or trained here.
      - name: Build the WebAssembly module
        working-directory: ai
        run: wasm-pack build nn-wasm --target web --release --out-dir ../web/pkg

      # The project cards follow what is pinned on the GitHub profile. If
      # GitHub can't be reached, the committed assets/projects.json is used.
      - name: Refresh the pinned projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/update-projects.sh || echo "::warning::Could not refresh the pinned projects; using the committed list."

      # The published site: the CV page at the root, the full demo under ai/web/.
      # The project cards are also written into the page as HTML, so they can
      # be read without JavaScript.
      - name: Assemble the site
        run: |
          mkdir -p _site/ai
          cp index.html 404.html robots.txt sitemap.xml llms.txt _site/
          cp -r assets _site/assets
          cp -r ai/web _site/ai/web
          rm -f _site/ai/web/pkg/.gitignore _site/ai/web/pkg/package.json
          node tools/render-projects.mjs _site/index.html || echo "::warning::Could not write the project cards into the page; they will only appear with JavaScript."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
