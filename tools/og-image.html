<!doctype html>
<!-- Source of assets/og-image.png, the picture shown when the site's link is
     shared. Open at 1200×630 and take a screenshot to regenerate it, e.g.
     chrome --headless --window-size=1200,630 --screenshot=assets/og-image.png tools/og-image.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 500 600; src: url("../assets/fonts/space-grotesk-latin.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400 500; src: url("../assets/fonts/ibm-plex-sans-latin.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../assets/fonts/ibm-plex-mono-500-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #12111c; color: #edecf4;
    font: 400 28px/40px "IBM Plex Sans", sans-serif;
    display: flex;
  }
  .text { flex: 1; padding: 72px 0 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .label { font: 500 20px/28px "IBM Plex Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #ef663e; }
  h1 { font: 600 92px/96px "Space Grotesk", sans-serif; letter-spacing: -0.02em; margin: 20px 0 24px; }
  p { color: #a09eb4; max-width: 560px; }
  .tags { display: flex; gap: 12px; }
  .tags span { font: 500 20px/28px "IBM Plex Mono", monospace; background: #0e3236; color: #23cbb4; border-radius: 6px; padding: 6px 14px; }
  .band { width: 380px; background: #004b4e; display: flex; align-items: center; justify-content: center; }
  svg { width: 300px; height: 440px; }
</style>
</head>
<body>
  <div class="text">
    <div>
      <div class="label">CV · Software developer</div>
      <h1>Thomas<br>de Boer</h1>
      <p>Software Development student. Projects, and a neural network built from scratch that runs in your browser.</p>
    </div>
    <div class="tags"><span>Java</span><span>Python</span><span>C#</span><span>Rust</span><span>tdeboer.com</span></div>
  </div>
  <div class="band">
    <!-- A small network: three layers, the answer in orange. -->
    <svg viewBox="0 0 300 440" fill="none" stroke-linecap="round">
      <g stroke="#23cbb4" stroke-width="3" opacity="0.55">
        <path d="M40 80L150 130M40 80L150 310M40 170L150 130M40 170L150 220M40 270L150 220M40 270L150 310M40 360L150 130M40 360L150 310"/>
        <path d="M150 130L260 220M150 220L260 220M150 310L260 220"/>
      </g>
      <g fill="#12111c" stroke="#23cbb4" stroke-width="4">
        <circle cx="40" cy="80" r="16"/><circle cx="40" cy="170" r="16" fill="#23cbb4"/>
        <circle cx="40" cy="270" r="16"/><circle cx="40" cy="360" r="16" fill="#23cbb4"/>
        <circle cx="150" cy="130" r="16" fill="#23cbb4"/><circle cx="150" cy="220" r="16"/><circle cx="150" cy="310" r="16" fill="#23cbb4"/>
      </g>
      <circle cx="260" cy="220" r="22" fill="#ef663e"/>
    </svg>
  </div>
</body>
</html>
