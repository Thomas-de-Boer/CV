<!doctype html>
<!-- Source of assets/og-image.png, the picture shown when the site's link is
     shared. Open at 1200×630 and take a screenshot to regenerate it, e.g.
     chrome --headless --window-size=1200,630 --screenshot=assets/og-image.png tools/og-image.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; font-weight: 600 700; src: url("../assets/fonts/archivo-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #151515; color: #ececea;
    font: 400 30px/42px "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 80px 88px;
  }
  h1 { font: 700 104px/1 "Archivo", sans-serif; letter-spacing: -0.03em; }
  p { color: #a3a3a0; max-width: 820px; margin-top: 32px; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; border-top: 2px solid #8aa8ff; padding-top: 24px; }
  .url { font: 700 30px/1 "Archivo", sans-serif; color: #8aa8ff; }
  .langs { color: #a3a3a0; font-size: 26px; }
</style>
</head>
<body>
  <div>
    <h1>Thomas de Boer</h1>
    <p>Software Development student. Projects, and a neural network I wrote from scratch that runs in your browser.</p>
  </div>
  <div class="foot">
    <span class="url">tdeboer.com</span>
    <span class="langs">Java · Python · C# · Rust · JavaScript</span>
  </div>

</html>
